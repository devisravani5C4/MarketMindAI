<!-- Top Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white rounded-3 shadow-sm mb-4 px-3 py-2 border">
    <div class="container-fluid p-0">
        <!-- Dashboard Title / Current Active View -->
        <div class="d-flex align-items-center">
            <span class="navbar-brand fw-bold mb-0 text-dark">
                <i class="bi bi-speedometer2 text-primary me-2"></i>
                <span id="current-section-title">Overview</span>
            </span>
        </div>

        <!-- Active File Badge & Actions -->
        <div class="d-flex align-items-center gap-3">
            {% if filename %}
            <div class="badge bg-light text-dark border p-2 fw-normal d-flex align-items-center gap-2">
                <i class="bi bi-file-earmark-spreadsheet text-success fs-6"></i>
                <span>Dataset: <strong>{{ filename }}</strong></span>
            </div>
            {% endif %}

            <a href="/" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
                <i class="bi bi-clock-history"></i> Dataset History
            </a>
            <a href="/logout" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>
