<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Analytics Dashboard - MarketMind AI</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Cached results (if this dataset was reloaded from history) get read by
         each section's script on load so a saved analysis can be restored
         without forcing the user to re-run it. -->
    <script>
        window.CACHED_RESULTS = {{ cached_results | default({}) | tojson }};
    </script>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar Navigation Include -->
            {% include 'layout/sidebar.html' %}

            <!-- Main Workspace Content -->
            <div class="col-lg-10 col-md-9 p-4">

                <!-- Header Navbar Include -->
                {% include 'layout/navbar.html' %}

                <!-- 1. Overview Section -->
                <div id="overview" class="content-section">
                    {% include 'sections/overview.html' %}
                </div>

                <!-- 2. Preprocessing Section -->
                <div id="preprocessing" class="content-section" style="display:none;">
                    {% include 'sections/preprocessing.html' %}
                </div>

                <!-- 3. Customer Segmentation (RFM) Section -->
                <div id="clustering" class="content-section" style="display:none;">
                    {% include 'sections/segmentation.html' %}
                </div>

                <!-- 4. Product Recommendation Section -->
                <div id="recommendation" class="content-section" style="display:none;">
                    {% include 'sections/recommendations.html' %}
                </div>

                <!-- 5. Reviews & Sentiment Section -->
                <div id="reviews" class="content-section" style="display:none;">
                    {% include 'sections/reviews.html' %}
                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Dashboard Logic & AJAX Handlers -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>

</html>
