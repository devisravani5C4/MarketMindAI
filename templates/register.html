<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MarketMind AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="hero-section text-center">
        <div class="container">
            <i class="bi bi-cpu-fill display-3 text-primary mb-3"></i>
            <h1 class="fw-bold display-5">MarketMind AI</h1>
            <p class="lead text-light opacity-75">Create an account to save and revisit your datasets.</p>
        </div>
    </div>

    <div class="container">
        <div class="card shadow-lg border-0 upload-card mx-auto" style="max-width: 460px;">
            <div class="card-body p-4 p-md-5">
                <h4 class="fw-bold text-center mb-4">
                    <i class="bi bi-person-plus-fill text-primary"></i> Create Account
                </h4>

                {% if error %}
                <div class="alert alert-danger py-2 small">{{ error }}</div>
                {% endif %}

                <form action="/register" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                        <div class="form-text">At least 6 characters.</div>
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-bold">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                        <i class="bi bi-person-plus-fill"></i> Create Account
                    </button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    Already have an account? <a href="/login">Log in</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
